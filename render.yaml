databases:
  - name: appmylife-db
    plan: free
    databaseName: appmylife_production
    user: appmylife

services:
  - type: web
    name: appmylife
    runtime: docker
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: appmylife-db
          property: connectionString
      - key: RAILS_MASTER_KEY
        sync: false
